{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — tkv</title>
<link rel="icon" href="/static/tk-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
{{end}}

{{define "chrome"}}
<header class="chrome">
  <div class="chrome-row chrome-primary">
    <a class="brand" href="/" aria-label="tkv home">
      <img src="/static/tk-logo.svg" alt="" width="28" height="28">
    </a>
    <nav class="primary" aria-label="sections">
      <a href="{{.Chrome.BoardHref}}"{{if eq .Chrome.Section "board"}} class="current"{{end}}>Board</a>
      <a href="{{.Chrome.GraphsHref}}"{{if eq .Chrome.Section "graphs"}} class="current"{{end}}>Graphs</a>
      <a href="{{.Chrome.MaintenanceHref}}"{{if eq .Chrome.Section "maintenance"}} class="current"{{end}}>Maintenance</a>
    </nav>
    <form class="search" action="/search" method="get">
      <input type="search" name="q" placeholder="search" value="{{.Chrome.Query}}" aria-label="search">
    </form>
  </div>
  <div class="chrome-row chrome-context">
    <nav class="scopes" aria-label="scopes">
      {{range .Chrome.Scopes}}
        <a href="/scope/{{.}}"{{if eq $.Chrome.Selected .}} class="selected"{{end}}>{{.}}</a>
      {{end}}
    </nav>
    <dl class="meta">
      <div><dt>scope</dt><dd>{{.Chrome.Selected}}</dd></div>
      <div><dt>mode</dt><dd>{{.Chrome.Mode}}</dd></div>
      <div><dt>lens</dt><dd>{{.Chrome.Lens}}</dd></div>
      <div><dt>me</dt><dd>{{.Chrome.Me}}</dd></div>
      <div><dt>integrity</dt><dd class="integrity-{{.Chrome.Integrity}}">{{.Chrome.Integrity}}</dd></div>
    </dl>
  </div>
</header>
{{end}}
