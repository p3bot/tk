{{define "note-edit"}}
<!DOCTYPE html>
<html lang="en">
<head>
{{template "head" .}}
</head>
<body class="edit">
{{template "chrome" .}}
<main class="inspect">
<article class="body">
  {{if .Missing}}<p class="empty">no file</p>{{end}}
  <form class="write splice" method="post" action="/scope/{{.Chrome.Selected}}/notes/{{.Slug}}" onsubmit="if(this.dataset.submitted)return false;this.dataset.submitted=1;var b=this.querySelector('button');if(b)b.disabled=true">
    <input type="hidden" name="base" value="{{.Base}}">
    <div class="edit-head">
      <h1>Edit {{.Slug}}</h1>
      <p class="form-actions">
        <button type="submit" aria-label="Save {{.Slug}}">Save</button>
        <a class="button" href="{{.ViewHref}}">Cancel</a>
      </p>
    </div>
    <label class="field-body">
      <span class="sr-only">Body</span>
      <textarea name="body" rows="16" required>
{{.EditBody}}</textarea>
    </label>
  </form>
</article>
{{template "noteAside" .}}
</main>
</body>
</html>
{{end}}
