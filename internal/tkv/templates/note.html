{{define "note"}}
<!DOCTYPE html>
<html lang="en">
<head>
{{template "head" .}}
</head>
<body>
{{template "chrome" .}}
<main class="inspect">
<article class="body">
  {{if .SnapMsg}}<p class="banner">{{.SnapMsg}}</p>{{end}}
  {{if .CanEdit}}
  <p class="content-edit"><a class="button" href="{{.EditHref}}">Edit</a></p>
  {{end}}
  {{if .Missing}}
  <h1>{{.Title}}</h1>
  <p class="empty">no file</p>
  {{else}}{{.Body}}{{end}}
</article>
{{template "noteAside" .}}
</main>
</body>
</html>
{{end}}
